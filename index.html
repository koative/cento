<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("cento-appearance");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch {}
        const dark =
          preference === "dark" ||
          (preference === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#0b0b0d"
          : "#ffffff";
      })();
    </script>
    <style>
      html {
        background: #ffffff;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        background: #0b0b0d;
        color-scheme: dark;
      }
    </style>
    <meta
      name="description"
      content="Cento: 100 complete, multi-page website templates by Koative. Browse them live, pick one and take the code with a single command. Open source, MIT licensed."
    />
    <meta property="og:title" content="Cento — 100 websites, ready to borrow" />
    <meta
      property="og:description"
      content="A hundred complete, multi-page website templates. Preview every page live, then take the code with one command."
    />
    <meta
      property="og:image"
      content="https://koative.github.io/cento/cento-social.png"
    />
    <meta property="og:url" content="https://koative.github.io/cento/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Cento — 100 websites, ready to borrow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/gallery/main.tsx"></script>
  </body>
</html>
